name: release

on:
  push:
    tags: ["v*"]

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.5"
      - run: go build ./...
      - run: go vet ./...
      - run: go test ./... -cover
      - name: gofmt check
        run: |
          out=$(gofmt -l .)
          [ -z "$out" ] || { echo "::error::unformatted: $out"; exit 1; }
      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9.3.0
        with:
          version: v2.12.2
          config-path: .golangci.yml
      - uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: Dockerfile
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: go-hadolint-poc:${{ github.ref_name }}

      - name: Smoke test container
        env:
          TAG: ${{ github.ref_name }}
        run: |
          out=$(docker run --rm "go-hadolint-poc:$TAG")
          [ "$out" = "Hello, world!" ] || { echo "::error::unexpected output: $out"; exit 1; }

      - name: Create GitHub Release
        env:
          TAG: ${{ github.ref_name }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release create "$TAG" --generate-notes
