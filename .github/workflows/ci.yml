name: ci

on:
  push:
  pull_request:

jobs:
  go-build-test:
    uses: robbasualto/pipelines/.github/workflows/go-build-test.yml@v1.0.1
    with:
      runner: lab-runner

  go-lint:
    uses: robbasualto/pipelines/.github/workflows/go-lint.yml@v1.0.1
    with:
      runner: lab-runner

  hadolint:
    uses: robbasualto/pipelines/.github/workflows/hadolint.yml@v1.0.1
    with:
      runner: lab-runner

  gitleaks:
    uses: robbasualto/pipelines/.github/workflows/gitleaks.yml@v1.0.1
    with:
      runner: lab-runner

  docker-build:
    needs: [go-build-test, go-lint, hadolint]
    runs-on: lab-runner
    steps:
      - uses: actions/checkout@v4

      - name: Resolve image ref
        run: |
          if [ -z "$NEXUS_REGISTRY_HOST" ]; then
            echo "::error::NEXUS_REGISTRY_HOST is not set on this runner"
            exit 1
          fi
          echo "IMAGE=$NEXUS_REGISTRY_HOST/go-hadolint-poc:${GITHUB_SHA::7}" >> "$GITHUB_ENV"

      - name: Nexus login
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        run: |
          echo "::add-mask::$NEXUS_DOCKER_PUSH_PASSWORD"
          echo "$NEXUS_DOCKER_PUSH_PASSWORD" | docker login "$NEXUS_REGISTRY_HOST" \
            -u "$NEXUS_DOCKER_PUSH_USERNAME" --password-stdin

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: ${{ env.IMAGE }}

      - name: Smoke test container
        run: |
          out=$(docker run --rm "$IMAGE")
          [ "$out" = "Hello, world!" ] || { echo "::error::unexpected output: $out"; exit 1; }

      - name: Trivy scan (report-only)
        uses: aquasecurity/trivy-action@v0.36.0
        continue-on-error: true
        with:
          image-ref: "${{ env.IMAGE }}"
          format: table
          exit-code: "0"

      - name: Push to Nexus
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        run: docker push "$IMAGE"

      - name: Nexus logout
        if: always() && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
        run: docker logout "$NEXUS_REGISTRY_HOST"
