name: ci

on:
  push:
  pull_request:

jobs:
  go-build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.5"
      - run: go build ./...
      - run: go vet ./...
      - run: go test ./... -cover

  go-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.5"
      - name: gofmt check
        run: |
          out=$(gofmt -l .)
          [ -z "$out" ] || { echo "::error::unformatted: $out"; exit 1; }
      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9.3.0
        with:
          version: v2.12.2
          config-path: .golangci.yml

  hadolint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: Dockerfile

  docker-build:
    needs: [go-build-test, go-lint, hadolint]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: go-hadolint-poc:ci

      - name: Smoke test container
        run: |
          out=$(docker run --rm go-hadolint-poc:ci)
          [ "$out" = "Hello, world!" ] || { echo "::error::unexpected output: $out"; exit 1; }

      - name: Trivy scan (report-only)
        uses: aquasecurity/trivy-action@v0.36.0
        continue-on-error: true
        with:
          image-ref: "go-hadolint-poc:ci"
          format: table
          exit-code: "0"
